[project]
name = "tradeinsight-command"
version = "0.2.0"
description = "מערכת לניתוב ובקרת פקודות מסחר (סימולציה מקומית)"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "google-genai>=1.0", "python-dotenv>=1.0", "python-bidi>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools]
packages = ["project_name"]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
